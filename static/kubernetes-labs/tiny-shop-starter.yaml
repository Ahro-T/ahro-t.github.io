apiVersion: v1
kind: Namespace
metadata:
  name: k8s-labs
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-content
  namespace: k8s-labs
data:
  index.html: |
    {"service":"tiny-shop-api","status":"ok"}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: k8s-labs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          startupProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: content
          configMap:
            name: api-content
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: k8s-labs
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: k8s-labs
data:
  default.conf: |
    server {
      listen 80;
      location / {
        root /usr/share/nginx/html;
        index index.html;
      }
      location /api/ {
        proxy_pass http://api/;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
      }
    }
  index.html: |
    <!doctype html>
    <html lang="ko">
      <meta charset="utf-8">
      <title>tiny-shop</title>
      <body><h1>tiny-shop web</h1><p>Try <code>/api/</code>.</p></body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: k8s-labs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          startupProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: web-config
            items:
              - key: default.conf
                path: default.conf
        - name: content
          configMap:
            name: web-config
            items:
              - key: index.html
                path: index.html
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: k8s-labs
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
